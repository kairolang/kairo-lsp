id = "kairo"
name = "Kairo"
version = "0.2.0"
schema_version = 1
authors = ["Dhruvan Kartik <kartd01@purdue.edu>"]
description = "Kairo language support: the kals language server (diagnostics, completion, semantic highlighting, formatting), syntax highlighting, outline, brackets, indentation, inline C++ injection."
repository = "https://github.com/kairolang/kairo-lsp"

# The grammar is ../tree-sitter-kairo in this repository. Zed builds a grammar
# from a git revision, never from a working tree, so this names a pushed
# commit. UNTIL kairo-lsp is pushed with tree-sitter-kairo/ in it, this points
# at the identical grammar in the compiler repository; afterwards switch to
#
#   repository = "https://github.com/kairolang/kairo-lsp"
#   path = "tree-sitter-kairo"
#   rev = "<the commit that added it>"
[grammars.kairo]
repository = "https://github.com/kairolang/kairo"
path = "Extras/LSPClients/tree-sitter-kairo"
rev = "9bfd1652b3c47e8d598ab4806c00119519d0e580"

# kals, the Kairo language server. src/lib.rs finds it on PATH.
[language_servers.kals]
name = "kals"
languages = ["Kairo"]
