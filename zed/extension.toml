id = "kairo"
name = "Kairo"
version = "0.3.0"
schema_version = 1
authors = ["Dhruvan Kartik"]
description = "Kairo language support: the kals language server (diagnostics, completion, semantic highlighting, formatting), syntax highlighting, outline, brackets, indentation and text objects."
repository = "https://github.com/kairolang/kairo-lsp"

# Zed builds a grammar from a git revision, never from a working tree: rev
# names a pushed commit of this repository whose tree-sitter-kairo/ is the
# grammar the queries in languages/ are written against.
[grammars.kairo]
repository = "https://github.com/kairolang/kairo-lsp"
path = "tree-sitter-kairo"
rev = "d707ed9284c10942fd176393eeff35710d000ade"

# kals, the Kairo language server. src/lib.rs finds it on PATH.
[language_servers.kals]
name = "kals"
languages = ["Kairo"]
